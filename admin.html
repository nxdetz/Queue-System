<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>พนักงาน · ระบบคิว</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="wrap" id="login" style="margin-top:12vh">
  <header><div class="logo">Q</div><h1>แผงควบคุมพนักงาน</h1></header>
  <div class="card"><input id="pin" type="password" inputmode="numeric" placeholder="รหัส PIN" style="margin-bottom:12px"><button class="btn" id="go" style="width:100%">เข้าสู่ระบบ</button><div id="err" style="color:var(--bad);margin-top:10px;text-align:center"></div></div>
</div>
<div class="wrap wide hide" id="app">
  <header><div class="logo">Q</div><h1>แผงควบคุมพนักงาน</h1><a href="display.html" target="_blank" style="color:var(--brand);font-size:14px;text-decoration:none">จอแสดงคิว ↗</a></header>
  <div class="stats">
    <div class="chip"><b id="a1">0</b><span>คิวทั้งหมดวันนี้</span></div><div class="chip"><b id="a2">0</b><span>กำลังรอ</span></div>
    <div class="chip"><b id="a3">0</b><span>เสร็จสิ้น</span></div><div class="chip"><b id="a4">0</b><span>เวลาเฉลี่ย (นาที)</span></div>
  </div>
  <div class="cols">
    <div>
      <h2>เลือกเคาน์เตอร์ของคุณ</h2><div class="tabs" id="tabs" style="margin:8px 0 12px"></div>
      <div class="card hero"><div class="lb" id="cl">กำลังให้บริการ</div><div class="code" id="cc">–</div><div class="sub" id="cs">ว่าง</div></div>
      <div class="ctl">
        <select class="full" id="sf"></select>
        <button class="btn full" id="call">เรียกคิวถัดไป</button>
        <button class="btn ghost" id="recall">เรียกซ้ำ</button><button class="btn ghost" id="done">เสร็จสิ้น</button>
        <button class="btn bad" id="skip">ข้ามคิว</button><button class="btn bad" id="reset">รีเซ็ตทั้งหมด</button>
      </div>
    </div>
    <div><h2>คิวที่รออยู่ (<span id="qn">0</span>)</h2><div class="card" id="queue" style="padding:6px 18px;margin-top:8px"></div></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[<>&"]/g,'');
let pin=sessionStorage.getItem('pin')||'',ctr=+sessionStorage.getItem('ctr')||1,S=null;
const call=(u,m='GET',b)=>fetch(u,{method:m,headers:{'x-pin':pin,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>{if(r.status===401)throw 0;return r.json()});
const sv=id=>S.services.find(s=>s.id===id)||{};
async function load(){
  try{S=await call('/api/admin/list');$('#login').classList.add('hide');$('#app').classList.remove('hide');render()}
  catch{sessionStorage.removeItem('pin');$('#login').classList.remove('hide');$('#app').classList.add('hide')}
}
function render(){
  $('#a1').textContent=S.stats.total;$('#a2').textContent=S.stats.waiting;$('#a3').textContent=S.stats.done;$('#a4').textContent=S.stats.avg;
  $('#tabs').innerHTML=S.counters.map(c=>`<button class="tab ${c===ctr?'on':''}" data-c="${c}">เคาน์เตอร์ ${c}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ctr=+b.dataset.c;sessionStorage.setItem('ctr',ctr);render()});
  const cur=S.serving.find(t=>t.counter===ctr);
  $('#cc').textContent=cur?cur.code:'–';$('#cl').textContent=`เคาน์เตอร์ ${ctr}`;
  $('#cs').textContent=cur?`${sv(cur.service).name}${cur.name?' · '+esc(cur.name):''}`:'ว่าง';
  const v=$('#sf').value;$('#sf').innerHTML='<option value="">เรียกจากทุกประเภทบริการ</option>'+S.services.map(s=>`<option value="${s.id}">${s.icon} ${s.name} (รอ ${S.waiting[s.id]})</option>`).join('');$('#sf').value=v;
  $('#qn').textContent=S.queue.length;
  $('#queue').innerHTML=S.queue.length?S.queue.map(t=>`<div class="q"><b>${t.code}</b><span>${esc(t.name)||sv(t.service).name}</span><span style="flex:none">${Math.floor((Date.now()-t.at)/60000)} นาที</span></div>`).join(''):'<div class="q"><span>ไม่มีคิวที่รออยู่ 🎉</span></div>';
}
const act=(p,extra)=>call('/api/admin/'+p,'POST',{counter:ctr,service:$('#sf').value||undefined,...extra}).then(load);
$('#go').onclick=()=>{pin=$('#pin').value;sessionStorage.setItem('pin',pin);load().then(()=>{if(!S)$('#err').textContent='รหัสไม่ถูกต้อง'})};
$('#call').onclick=()=>act('call');$('#recall').onclick=()=>act('recall');$('#done').onclick=()=>act('done');
$('#skip').onclick=()=>confirm('ข้ามคิวปัจจุบัน?')&&act('skip');
$('#reset').onclick=()=>confirm('รีเซ็ตคิวทั้งหมดของวันนี้?')&&act('reset');
if(pin)load();setInterval(()=>pin&&load(),3000);
</script></body></html>
