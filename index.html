<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคิว</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="wrap">
  <header><div class="logo">Q</div><h1 id="shop">ระบบคิว</h1><div class="live"><i></i><span id="clock"></span></div></header>
  <div class="card hero"><div class="lb">กำลังเรียกคิวล่าสุด</div><div class="code" id="hc">–</div><div class="sub" id="hs">ยังไม่มีการเรียกคิว</div></div>
  <div class="chips">
    <div class="chip"><b id="s1">0</b><span>กำลังรอ</span></div>
    <div class="chip"><b id="s2">0</b><span>นาที/คิว (เฉลี่ย)</span></div>
    <div class="chip"><b id="s3">0</b><span>เสร็จสิ้นวันนี้</span></div>
  </div>
  <div id="mine" class="card ticket hide"></div>
  <div id="take">
    <h2>รับบัตรคิว</h2>
    <input id="name" placeholder="ชื่อของคุณ (ไม่บังคับ)" maxlength="30" style="margin:8px 0 10px">
    <div id="svcs" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
  <h2>เรียกล่าสุด</h2><div class="card" id="recent" style="padding:8px 18px"></div>
</div>
<script>
const $=s=>document.querySelector(s),api=(u,o)=>fetch(u,o).then(r=>r.json());
const esc=s=>String(s||'').replace(/[<>&"]/g,'');
let S=null,T=null,my=JSON.parse(localStorage.getItem('my')||'null'),beeped=false;
const sv=id=>S.services.find(s=>s.id===id)||{};
function beep(){try{const a=new AudioContext();[0,.25].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.2);o.start(a.currentTime+d);o.stop(a.currentTime+d+.2)})}catch{}navigator.vibrate?.([200,100,200])}
async function load(){
  try{S=await api('/api/state');
  if(my){T=await api('/api/ticket/'+my.id);if(T.error){my=null;T=null;localStorage.removeItem('my')}}
  render()}catch{}
}
function render(){
  $('#shop').textContent=S.shop;$('#clock').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const r=S.recent[0];$('#hc').textContent=r?r.code:'–';
  $('#hs').textContent=r?`เคาน์เตอร์ ${r.counter} · ${sv(r.service).name}`:'ยังไม่มีการเรียกคิว';
  $('#s1').textContent=S.stats.waiting;$('#s2').textContent=S.stats.avg;$('#s3').textContent=S.stats.done;
  $('#svcs').innerHTML=S.services.map(s=>`<button class="svc" data-id="${s.id}"><div class="ic">${s.icon}</div><div class="t"><b>${s.name}</b><span>รอ ${S.waiting[s.id]} คิว · ~${Math.ceil((S.waiting[s.id]+1)*S.stats.avg/S.counters.length)} นาที</span></div><div class="go">รับคิว ›</div></button>`).join('');
  document.querySelectorAll('.svc').forEach(b=>b.onclick=()=>take(b.dataset.id));
  $('#recent').innerHTML=S.recent.length?S.recent.map(x=>`<div class="rec"><b>${x.code}</b><span>${sv(x.service).name} · เคาน์เตอร์ ${x.counter}</span></div>`).join(''):'<div class="rec"><span>ยังไม่มีข้อมูล</span></div>';
  const m=$('#mine');
  if(!T){m.classList.add('hide');$('#take').classList.remove('hide');return}
  m.classList.remove('hide');$('#take').classList.add('hide');
  let h=`<span class="badge">${sv(T.service).icon} ${sv(T.service).name}</span><div class="code">${T.code}</div>${T.name?`<div style="color:var(--muted)">${esc(T.name)}</div>`:''}<div class="dash"></div>`;
  if(T.status==='waiting'){
    const p=my.start?Math.max(6,(1-T.ahead/my.start)*100):8;
    h+=`<div class="grid2"><div><b>${T.ahead+1}</b><span>ลำดับของคุณ</span></div><div><b>~${T.eta}</b><span>นาที (โดยประมาณ)</span></div></div>
    <div class="bar"><i style="width:${p}%"></i></div><div style="color:var(--muted);font-size:13px">${T.ahead===0?'คุณเป็นคิวถัดไป เตรียมตัวได้เลย':`อีก ${T.ahead} คิวจะถึงคุณ`}</div>
    <button class="btn bad" id="cx" style="margin-top:16px;width:100%">ยกเลิกคิว</button>`;
  }else if(T.status==='serving'){
    if(!beeped){beeped=true;beep()}
    h+=`<div class="badge ok pulse">ถึงคิวคุณแล้ว</div><div style="font-size:22px;font-weight:600;margin-top:10px">เคาน์เตอร์ ${T.counter}</div>`;
  }else{
    h+=`<div style="margin-bottom:14px">${{done:'เสร็จสิ้นแล้ว ขอบคุณที่ใช้บริการ',skipped:'คิวของคุณถูกข้าม กรุณารับคิวใหม่',cancelled:'ยกเลิกคิวแล้ว'}[T.status]}</div><button class="btn" id="nw" style="width:100%">รับคิวใหม่</button>`;
  }
  m.innerHTML=h;
  $('#cx')&&($('#cx').onclick=async()=>{if(confirm('ยืนยันยกเลิกคิว?')){await api(`/api/ticket/${my.id}/cancel`,{method:'POST'});load()}});
  $('#nw')&&($('#nw').onclick=()=>{my=null;T=null;beeped=false;localStorage.removeItem('my');render()});
}
async function take(id){
  const t=await api('/api/ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:id,name:$('#name').value})});
  my={id:t.id,start:t.ahead};beeped=false;localStorage.setItem('my',JSON.stringify(my));load();window.scrollTo({top:0,behavior:'smooth'});
}
load();setInterval(load,3000);
</script></body></html>
