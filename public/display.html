<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>จอแสดงคิว</title><link rel="stylesheet" href="app.css">
<style>
body{background:#0c1b29;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;padding:20px 40px;font-size:26px;font-weight:600}
main{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;padding:0 40px 20px;min-height:0}
.now{background:#13293d;border-radius:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid transparent}
.now.pulse{animation:p 1s 4;border-color:#f5b83d}
@keyframes p{50%{background:#3a2f12}}
.now small{font-size:28px;opacity:.7}
#no{font-size:clamp(100px,18vw,260px);font-weight:700;line-height:1;color:var(--c,#f5b83d)}
#at{font-size:clamp(34px,4vw,56px);font-weight:600;margin-top:8px}
.cs{display:grid;grid-auto-rows:1fr;gap:14px;min-height:0}
.c{background:#13293d;border-radius:20px;padding:12px 26px;display:flex;justify-content:space-between;align-items:center;border-left:10px solid #2c445a}
.c.on{border-left-color:#f5b83d}.c.off{opacity:.4}
.c span{font-size:26px}.c b{font-size:clamp(34px,4vw,56px);color:#f5b83d}.c i{font-style:normal;opacity:.55;font-size:22px}
footer{display:flex;gap:16px;padding:0 40px 24px;flex-wrap:wrap}
.w{flex:1;min-width:200px;background:#13293d;border-radius:18px;padding:14px 20px;border-top:6px solid var(--c)}
.w b{font-size:20px}.w div{font-size:26px;margin-top:4px;opacity:.9}
#unlock{position:fixed;right:24px;bottom:24px;z-index:5;padding:14px 22px;font-size:18px;box-shadow:0 8px 24px #0008}
</style></head><body>
<button class="btn" id="unlock" onclick="enable(true)">🔊 เปิดเสียง + เต็มจอ</button>
<header><div id="org"></div><div id="clock"></div></header>
<main><section class="now" id="now"><small>ขอเชิญหมายเลข</small><div id="no">—</div><div id="at">รอการเรียกคิว</div></section><section class="cs" id="cs"></section></main>
<footer id="ft"></footer>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);let audio=false,ac,st;
const socket=io();socket.on('state',render);
socket.on('call',e=>{const n=$('#now');n.classList.remove('pulse');void n.offsetWidth;n.classList.add('pulse');if(audio)say(e.number,e.counter)});
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('th-TH'),1000);
function enable(full){if(audio)return;audio=true;$('#unlock').hidden=true;if(full&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});ac=new(window.AudioContext||window.webkitAudioContext)();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance('เปิดเสียงเรียกคิวแล้ว');u.lang='th-TH';speechSynthesis.speak(u)}}
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>enable(false),{once:true}));
function chime(){if(!ac)return;[660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.25;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5)})}
function say(n,c){chime();if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(`ขอเชิญหมายเลข ${n[0]} ${n.slice(1).split('').join(' ')} ที่ ${c} ค่ะ`);u.lang='th-TH';u.rate=.9;setTimeout(()=>speechSynthesis.speak(u),700)}
function render(s){
  st=s;$('#org').textContent=s.settings.org;
  const r=s.recent[0];
  if(r){$('#no').textContent=r.number;$('#no').style.setProperty('--c',r.color);$('#at').textContent=r.counterName||''}
  else{$('#no').textContent='—';$('#at').textContent='รอการเรียกคิว'}
  $('#cs').innerHTML=s.counters.map(c=>`<div class="c ${c.ticket?'on':''} ${c.open?'':'off'}"><span>${c.name}</span>${c.ticket?`<b>${c.ticket.number}</b>`:`<i>${c.open?'ว่าง':'ปิดให้บริการ'}</i>`}</div>`).join('');
  $('#ft').innerHTML=s.services.map(v=>{const w=s.waiting.filter(t=>t.service===v.id);return `<div class="w" style="--c:${v.color}"><b>${v.id} · ${v.name}</b> (รอ ${w.length})<div>${w.slice(0,3).map(t=>t.number).join('  ')||'—'}</div></div>`}).join('');
}
</script></body></html>
