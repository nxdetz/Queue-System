<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคิว</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body><main>
<h1>ระบบคิว</h1>
<div class="card">
  <div class="label">กำลังเรียกคิว</div>
  <div class="big" id="serving">–</div>
  <div class="row" style="margin-top:24px">
    <div class="stat"><b id="waiting">0</b><span>รอคิวอยู่</span></div>
    <div class="stat"><b id="last">0</b><span>คิวล่าสุด</span></div>
  </div>
</div>

<div class="card" id="take">
  <input id="name" placeholder="ชื่อ (ไม่บังคับ)" maxlength="30">
  <button id="takeBtn">รับบัตรคิว</button>
</div>

<div class="card hide" id="mine">
  <div class="label">คิวของคุณ</div>
  <div class="big mid" id="myNum">–</div>
  <div class="msg" id="myMsg"></div>
  <button class="ghost" id="cancelBtn" style="margin-top:20px">ยกเลิกคิว</button>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let my=Number(localStorage.getItem('myTicket'))||null;
const api=(u,o)=>fetch(u,o).then(r=>r.json());

async function refresh(){
  try{
    const s=await api('/api/state');
    $('serving').textContent=s.serving??'–';
    $('waiting').textContent=s.waiting;$('last').textContent=s.last;
    if(my){
      const t=await api('/api/ticket/'+my);
      if(t.error){clear();return}
      show(t);
    }
  }catch{}
}
function show(t){
  $('take').classList.add('hide');$('mine').classList.remove('hide');
  $('myNum').textContent=t.n;
  const m=$('myMsg');m.className='msg';
  if(t.status==='serving'){m.textContent='ถึงคิวคุณแล้ว กรุณาติดต่อเคาน์เตอร์';m.classList.add('ok','pulse');
    if(!window._n){window._n=1;navigator.vibrate?.([200,100,200])}
    $('cancelBtn').classList.add('hide')}
  else if(t.status==='waiting'){
    m.textContent=t.ahead===0?'คุณเป็นคิวถัดไป':`อีก ${t.ahead} คิวจะถึงคุณ`;
    if(t.ahead===0)m.classList.add('ok')}
  else{m.textContent={done:'เสร็จสิ้นแล้ว',skipped:'คิวของคุณถูกข้าม',cancelled:'ยกเลิกแล้ว'}[t.status];
    $('cancelBtn').textContent='รับคิวใหม่';$('cancelBtn').dataset.reset=1}
}
function clear(){localStorage.removeItem('myTicket');my=null;window._n=0;
  $('mine').classList.add('hide');$('take').classList.remove('hide');
  $('cancelBtn').textContent='ยกเลิกคิว';$('cancelBtn').classList.remove('hide');delete $('cancelBtn').dataset.reset}

$('takeBtn').onclick=async()=>{
  const t=await api('/api/ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value})});
  my=t.n;localStorage.setItem('myTicket',my);refresh();
};
$('cancelBtn').onclick=async e=>{
  if(!e.target.dataset.reset&&!confirm('ยืนยันยกเลิกคิว?'))return;
  if(!e.target.dataset.reset)await api(`/api/ticket/${my}/cancel`,{method:'POST'});
  clear();refresh();
};
refresh();setInterval(refresh,3000);
</script></body></html>
