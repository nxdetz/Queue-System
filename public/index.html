<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคิว</title><link rel="stylesheet" href="app.css">
<style>
header{background:var(--ink);color:#fff;padding:36px 24px;text-align:center}
header h1{font-size:32px}header p{opacity:.7;margin-top:6px}
main{max-width:900px;margin:0 auto;padding:32px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
@media(max-width:480px){main{grid-template-columns:1fr}}
a.m{display:block;background:#fff;border-radius:22px;padding:28px;text-decoration:none;color:var(--ink);border-left:12px solid var(--c);box-shadow:0 1px 2px #12263a0d,0 10px 28px #12263a12}
a.m:active{transform:scale(.98)}
a.m b{font-size:26px;display:block}a.m span{color:var(--mute);display:block;margin-top:6px}
</style></head><body>
<header><h1 id="org">ระบบคิว</h1><p>เลือกหน้าที่ต้องการใช้งาน</p></header>
<main>
<a class="m" style="--c:#0f9d8a" href="/kiosk.html"><b>ตู้กดบัตรคิว</b><span>สำหรับลูกค้า — วางไว้บนแท็บเล็ตหน้าร้าน</span></a>
<a class="m" style="--c:#d98a00" href="/display.html"><b>จอแสดงคิว</b><span>สำหรับทีวี — แสดงคิวที่กำลังเรียก พร้อมเสียง</span></a>
<a class="m" style="--c:#3b6fd4" href="/staff.html"><b>เจ้าหน้าที่</b><span>เรียกคิว ดูสถิติ ตั้งค่า (ต้องใช้ PIN)</span></a>
</main>
<script>fetch('/api/state').then(r=>r.json()).then(s=>document.getElementById('org').textContent=s.settings.org)</script>
</body></html>
